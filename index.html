<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Prayer Times</title>
  <style>
    :root {
      --page: #191919;
      --surface: #101010;
      --surface-raised: #151515;
      --border: rgba(255, 255, 255, 0.1);
      --border-strong: rgba(255, 255, 255, 0.17);
      --text: #f1f1ee;
      --muted: #858585;
      --muted-light: #b9b9b5;
      --red-dark: #681017;
      --red: #c91d29;
      --red-bright: #ff4d57;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-width: 0;
      min-height: 100%;
      background: var(--page);
    }

    body {
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .widget {
      width: min(100%, 560px);
      margin: 0 auto;
      padding: 28px 20px 24px;
    }

    .topbar,
    .next-header,
    .date-row,
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .topbar {
      align-items: flex-start;
      margin-bottom: 22px;
    }

    .eyebrow,
    .section-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      line-height: 1;
      text-transform: uppercase;
    }

    .location-display {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 7px;
      color: var(--muted-light);
      font-size: 12px;
      text-align: right;
    }

    .location-display span {
      max-width: 190px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .location-icon {
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
      color: var(--red-bright);
    }

    .location-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 27px;
      height: 27px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 50%;
      color: var(--muted-light);
      background: transparent;
      transition: color 160ms ease, background 160ms ease, border-color 160ms ease;
    }

    .location-button:hover,
    .location-button:focus-visible {
      border-color: var(--border-strong);
      color: var(--text);
      background: var(--surface);
      outline: none;
    }

    .settings-icon {
      width: 14px;
      height: 14px;
    }

    .prayer-list {
      border-top: 1px solid var(--border);
    }

    .prayer-row {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      min-height: 47px;
      border-bottom: 1px solid var(--border);
      color: var(--muted-light);
    }

    .prayer-row.active {
      color: var(--text);
    }

    .prayer-row.active::before {
      position: absolute;
      top: 0;
      bottom: 0;
      left: -20px;
      width: 2px;
      content: "";
      background: linear-gradient(180deg, var(--red-dark), var(--red-bright));
    }

    .prayer-name {
      font-size: 13px;
      font-weight: 500;
    }

    .prayer-time {
      color: var(--text);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    .prayer-row:not(.active) .prayer-time {
      color: var(--muted-light);
    }

    .next-section {
      margin-top: 25px;
    }

    .next-header {
      margin-bottom: 10px;
    }

    .next-label {
      color: var(--red-bright);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
    }

    .next-name {
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      text-transform: uppercase;
    }

    .countdown {
      color: var(--text);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    .next-progress {
      height: 2px;
      overflow: hidden;
      background: #bebebe;
    }

    .next-progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--red-dark), var(--red-bright));
      transition: width 300ms ease;
    }

    .date-row {
      justify-content: flex-start;
      flex-wrap: wrap;
      margin-top: 19px;
      color: var(--muted);
      font-size: 11px;
    }

    .date-divider {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #555;
    }

    .status {
      min-height: 17px;
      margin-top: 17px;
      color: var(--muted);
      font-size: 11px;
    }

    .status.error {
      color: #ff777e;
    }

    .loading {
      color: var(--muted);
      font-size: 12px;
    }

    .modal-backdrop {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: grid;
      place-items: end center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.64);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      width: min(100%, 560px);
      padding: 21px;
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      background: var(--surface);
      transform: translateY(12px);
      transition: transform 180ms ease;
    }

    .modal-backdrop.open .modal {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 21px;
    }

    .modal-title {
      margin: 0 0 7px;
      color: var(--text);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    .modal-description {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .close-button {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 29px;
      height: 29px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 50%;
      color: var(--muted-light);
      background: transparent;
      font-size: 19px;
      line-height: 1;
    }

    .close-button:hover {
      color: var(--text);
      background: var(--surface-raised);
    }

    .field-label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .location-input,
    .method-select {
      width: 100%;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 7px;
      outline: none;
      color: var(--text);
      background: var(--surface-raised);
      font-size: 12px;
    }

    .location-input {
      padding: 0 13px;
    }

    .location-input::placeholder {
      color: #707070;
    }

    .location-input:focus,
    .method-select:focus {
      border-color: var(--border-strong);
    }

    .setting-row {
      align-items: flex-end;
      margin-top: 16px;
    }

    .method-wrap {
      width: 100%;
    }

    .method-select {
      padding: 0 10px;
    }

    .method-select option {
      color: #fff;
      background: #161616;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 21px;
    }

    .action-button {
      min-height: 39px;
      padding: 0 14px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
    }

    .primary-button {
      flex: 1;
      border: 1px solid rgba(255, 65, 75, 0.35);
      color: #fff;
      background: linear-gradient(105deg, var(--red-dark), var(--red));
    }

    .secondary-button {
      border: 1px solid var(--border);
      color: var(--muted-light);
      background: transparent;
    }

    .action-button:hover {
      filter: brightness(1.12);
    }

    @media (max-width: 420px) {
      .widget {
        padding: 24px 15px 20px;
      }

      .prayer-row.active::before {
        left: -15px;
      }

      .modal-backdrop {
        padding: 10px;
      }

      .modal {
        padding: 17px;
      }

      .location-display span {
        max-width: 125px;
      }
    }
  </style>
</head>
<body>
  <main class="widget">
    <header class="topbar">
      <div class="eyebrow">PRAYER TIMES</div><div class="location-display">    <svg class="location-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">      <path d="M20 10.2c0 5.5-8 11-8 11s-8-5.5-8-11a8 8 0 1 1 16 0Z"></path>      <circle cx="12" cy="10.2" r="2.5"></circle>    </svg>    <span id="locationName">Localisation...</span>    <button class="location-button" id="openSettings" type="button" aria-label="Modifier la localisation">      <svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">        <circle cx="12" cy="12" r="3"></circle>        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.7 1.7-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V20h-2.4v-.2a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-1.7-1.7.06-.06A1.7 1.7 0 0 0 8.46 15a1.7 1.7 0 0 0-1.56-1.03H6v-2.4h.9A1.7 1.7 0 0 0 8.46 10a1.7 1.7 0 0 0-.34-1.88l-.06-.06 1.7-1.7.06.06a1.7 1.7 0 0 0 1.88.34 1.7 1.7 0 0 0 1.03-1.56V5h2.4v.2a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 1.7 1.7-.06.06A1.7 1.7 0 0 0 19.4 10a1.7 1.7 0 0 0 1.56 1.03H21v2.4h-.04A1.7 1.7 0 0 0 19.4 15Z"></path>      </svg>    </button>  </div></header><section class="prayer-list" id="prayerList" aria-label="Heures de prière">  <div class="loading">Chargement des horaires...</div></section><section class="next-section" aria-label="Prochaine prière">  <div class="next-header">    <div>      <div class="next-label">NEXT PRAYER</div>      <div class="next-name" id="nextName">—</div>    </div>    <div class="countdown" id="countdown">—</div>  </div>  <div class="next-progress">    <div class="next-progress-fill" id="nextProgressFill"></div>  </div></section><div class="date-row">  <span id="gregorianDate">—</span>  <span class="date-divider"></span>  <span id="hijriDate">—</span></div><div class="status" id="status"></div>
  </main>
  <div class="modal-backdrop" id="settingsBackdrop" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-header">
        <div>
          <h2 class="modal-title" id="settingsTitle">Location & méthode</h2>
          <p class="modal-description">Les horaires sont calculés automatiquement selon la date et la position choisie.</p>
        </div>
        <button class="close-button" id="closeSettings" type="button" aria-label="Fermer">×</button>
      </div><label class="field-label" for="cityInput">Ville ou adresse</label>  <input    class="location-input"    id="cityInput"    type="text"    autocomplete="address-level2"    placeholder="Ex. Paris, France"  />  <div class="setting-row">    <div class="method-wrap">      <label class="field-label" for="methodSelect">Méthode de calcul</label>      <select class="method-select" id="methodSelect">        <option value="3">Muslim World League</option>        <option value="2">Islamic Society of North America</option>        <option value="4">Umm Al-Qura University, Makkah</option>        <option value="5">Egyptian General Authority</option>        <option value="12">France — UOIF</option>        <option value="13">Diyanet</option>      </select>    </div>  </div>  <div class="modal-actions">    <button class="action-button secondary-button" id="useLocation" type="button">Utiliser ma position</button>    <button class="action-button primary-button" id="saveSettings" type="button">Enregistrer</button>  </div></section>
  </div>
  <script>
    (() => {
      "use strict";

      const API_BASE = "https://api.aladhan.com/v1";
      const GEO_URL = "https://nominatim.openstreetmap.org/search";
      const STORAGE_KEY = "prayerTimesWidgetSettings";

      const PRAYERS = [
        { key: "Fajr", label: "Fajr" },
        { key: "Dhuhr", label: "Dhuhr" },
        { key: "Asr", label: "Asr" },
        { key: "Maghrib", label: "Maghrib" },
        { key: "Isha", label: "Isha" }
      ];

      const $ = (selector) => document.querySelector(selector);

      const prayerList = $("#prayerList");
      const locationName = $("#locationName");
      const nextName = $("#nextName");
      const countdown = $("#countdown");
      const nextProgressFill = $("#nextProgressFill");
      const gregorianDate = $("#gregorianDate");
      const hijriDate = $("#hijriDate");
      const status = $("#status");

      const settingsBackdrop = $("#settingsBackdrop");
      const cityInput = $("#cityInput");
      const methodSelect = $("#methodSelect");

      let settings = loadSettings();
      let currentData = null;
      let refreshTimer = null;
      let countdownTimer = null;
      let activeCoordinates = null;

      function loadSettings() {
        try {
          return {
            city: localStorage.getItem(STORAGE_KEY + ":city") || "",
            latitude: Number(localStorage.getItem(STORAGE_KEY + ":latitude")) || null,
            longitude: Number(localStorage.getItem(STORAGE_KEY + ":longitude")) || null,
            displayName: localStorage.getItem(STORAGE_KEY + ":displayName") || "",
            method: localStorage.getItem(STORAGE_KEY + ":method") || "3"
          };
        } catch {
          return { city: "", latitude: null, longitude: null, displayName: "", method: "3" };
        }
      }

      function saveSettings() {
        localStorage.setItem(STORAGE_KEY + ":city", settings.city);
        localStorage.setItem(STORAGE_KEY + ":latitude", settings.latitude);
        localStorage.setItem(STORAGE_KEY + ":longitude", settings.longitude);
        localStorage.setItem(STORAGE_KEY + ":displayName", settings.displayName);
        localStorage.setItem(STORAGE_KEY + ":method", settings.method);
      }

      function setStatus(message = "", isError = false) {
        status.textContent = message;
        status.className = "status" + (isError ? " error" : "");
      }

      function todayKey() {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
      }

      function formatTime(value) {
        if (!value) return "—";
        return value.split(" ")[0].replace(/[^\d:]/g, "");
      }

      function parseTime(value, baseDate = new Date()) {
        const clean = formatTime(value);
        const [hours, minutes] = clean.split(":").map(Number);
        const date = new Date(baseDate);
        date.setHours(hours || 0, minutes || 0, 0, 0);
        return date;
      }

      function formatCountdown(milliseconds) {
        const totalMinutes = Math.max(0, Math.ceil(milliseconds / 60000));
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        return `${String(hours).padStart(2, "0")}h ${String(minutes).padStart(2, "0")}m`;
      }

      function formatGregorian(date) {
        return new Intl.DateTimeFormat("fr-FR", {
          day: "numeric",
          month: "long",
          year: "numeric"
        }).format(date);
      }

      function updateDates(data) {
        const now = new Date();
        gregorianDate.textContent = formatGregorian(now);

        const hijri = data?.date?.hijri;
        if (hijri?.day && hijri?.month?.en && hijri?.year) {
          hijriDate.textContent = `${hijri.day} ${hijri.month.en} ${hijri.year}`;
        } else {
          hijriDate.textContent = "";
        }
      }

      function renderPrayerRows(timings) {
        prayerList.innerHTML = PRAYERS.map((prayer) => `
          <div class="prayer-row" data-prayer="${prayer.key}">
            <span class="prayer-name">${prayer.label}</span>
            <span class="prayer-time">${formatTime(timings[prayer.key])}</span>
          </div>
        `).join("");
      }

      function updateCurrentPrayer() {
        if (!currentData?.timings) return;

        const now = new Date();
        const prayerTimes = PRAYERS.map((prayer) => ({
          ...prayer,
          time: parseTime(currentData.timings[prayer.key], now)
        }));

        let next = prayerTimes.find((prayer) => prayer.time > now);
        let nextTime = next?.time;
        let previousTime = null;

        if (!next) {
          next = prayerTimes[0];
          nextTime = new Date(prayerTimes[0].time);
          nextTime.setDate(nextTime.getDate() + 1);
          previousTime = prayerTimes[prayerTimes.length - 1].time;
        } else {
          const nextIndex = prayerTimes.findIndex((prayer) => prayer.key === next.key);
          previousTime = nextIndex > 0
            ? prayerTimes[nextIndex - 1].time
            : (() => {
                const previous = new Date(prayerTimes[prayerTimes.length - 1].time);
                previous.setDate(previous.getDate() - 1);
                return previous;
              })();
        }

        document.querySelectorAll(".prayer-row").forEach((row) => {
          row.classList.toggle("active", row.dataset.prayer === next.key);
        });

        const remaining = nextTime - now;
        const totalInterval = nextTime - previousTime;
        const elapsed = now - previousTime;
        const percentage = Math.min(100, Math.max(0, (elapsed / totalInterval) * 100));

        nextName.textContent = next.label;
        countdown.textContent = formatCountdown(remaining);
        nextProgressFill.style.width = `${percentage}%`;

        if (currentData.timezone) {
          setStatus(`Mis à jour · ${currentData.timezone}`);
        }
      }

      async function geocodeCity(city) {
        const url = `${GEO_URL}?format=jsonv2&limit=1&accept-language=fr&q=${encodeURIComponent(city)}`;
        const response = await fetch(url, {
          headers: { "Accept": "application/json" }
        });

        if (!response.ok) throw new Error("Recherche de ville impossible.");

        const results = await response.json();
        if (!results.length) throw new Error("Ville introuvable. Essayez une autre recherche.");

        const result = results[0];
        return {
          latitude: Number(result.lat),
          longitude: Number(result.lon),
          displayName: result.display_name.split(",").slice(0, 2).join(",")
        };
      }

      async function loadPrayerTimes(latitude, longitude) {
        const date = new Date();
        const dateString = `${String(date.getDate()).padStart(2, "0")}-${String(date.getMonth() + 1).padStart(2, "0")}-${date.getFullYear()}`;
        const url = `${API_BASE}/timings/${dateString}?latitude=${encodeURIComponent(latitude)}&longitude=${encodeURIComponent(longitude)}&method=${encodeURIComponent(settings.method)}`;

        const response = await fetch(url);
        if (!response.ok) throw new Error("Les horaires de prière sont indisponibles.");

        const json = await response.json();
        if (json.code !== 200 || !json.data?.timings) {
          throw new Error("Réponse invalide du service d'horaires.");
        }

        return json.data;
      }

      async function loadForCoordinates(latitude, longitude, displayName) {
        setStatus("Chargement des horaires...");
        locationName.textContent = displayName || "Position actuelle";

        try {
          const data = await loadPrayerTimes(latitude, longitude);
          currentData = data;
          activeCoordinates = { latitude, longitude };

          renderPrayerRows(data.timings);
          updateDates(data);
          updateCurrentPrayer();

          settings.latitude = latitude;
          settings.longitude = longitude;
          settings.displayName = displayName || "Position actuelle";
          saveSettings();
        } catch (error) {
          prayerList.innerHTML = `<div class="loading">Impossible de charger les horaires.</div>`;
          nextName.textContent = "—";
          countdown.textContent = "—";
          nextProgressFill.style.width = "0%";
          setStatus(error.message || "Une erreur est survenue.", true);
        }
      }

      function requestUserLocation() {
        if (!navigator.geolocation) {
          openSettings();
          setStatus("La géolocalisation n'est pas disponible.", true);
          return;
        }

        setStatus("Recherche de votre position...");

        navigator.geolocation.getCurrentPosition(
          (position) => {
            loadForCoordinates(
              position.coords.latitude,
              position.coords.longitude,
              "Position actuelle"
            );
            closeSettings();
          },
          () => {
            openSettings();
            setStatus("Position refusée. Entrez votre ville pour continuer.", true);
          },
          { enableHighAccuracy: false, timeout: 10000, maximumAge: 3600000 }
        );
      }

      function openSettings() {
        cityInput.value = settings.city || "";
        methodSelect.value = settings.method || "3";
        settingsBackdrop.classList.add("open");
        settingsBackdrop.setAttribute("aria-hidden", "false");
        setTimeout(() => cityInput.focus(), 50);
      }

      function closeSettings() {
        settingsBackdrop.classList.remove("open");
        settingsBackdrop.setAttribute("aria-hidden", "true");
      }

      async function saveLocationForm() {
        const city = cityInput.value.trim();

        if (!city) {
          setStatus("Veuillez saisir une ville.", true);
          cityInput.focus();
          return;
        }

        settings.method = methodSelect.value;
        setStatus("Recherche de la ville...");

        try {
          const location = await geocodeCity(city);
          settings.city = city;
          await loadForCoordinates(
            location.latitude,
            location.longitude,
            location.displayName
          );
          closeSettings();
        } catch (error) {
          setStatus(error.message || "Ville introuvable.", true);
        }
      }

      $("#openSettings").addEventListener("click", openSettings);
      $("#closeSettings").addEventListener("click", closeSettings);
      $("#useLocation").addEventListener("click", requestUserLocation);
      $("#saveSettings").addEventListener("click", saveLocationForm);

      cityInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") saveLocationForm();
      });

      settingsBackdrop.addEventListener("click", (event) => {
        if (event.target === settingsBackdrop) closeSettings();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeSettings();
      });

      function startTimers() {
        clearInterval(countdownTimer);
        clearInterval(refreshTimer);

        countdownTimer = setInterval(() => {
          updateCurrentPrayer();
          updateDates(currentData);
        }, 30000);

        refreshTimer = setInterval(() => {
          if (activeCoordinates) {
            loadForCoordinates(
              activeCoordinates.latitude,
              activeCoordinates.longitude,
              settings.displayName
            );
          }
        }, 3600000);
      }

      async function initialize() {
        startTimers();

        if (settings.latitude && settings.longitude) {
          await loadForCoordinates(
            settings.latitude,
            settings.longitude,
            settings.displayName || settings.city || "Position enregistrée"
          );
          return;
        }

        requestUserLocation();
      }

      initialize();
    })();
  </script>
