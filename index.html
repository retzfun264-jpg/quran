<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quran Progress</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: transparent;
        color: white;
        font-family: Arial, sans-serif;
    }

    .widget {
        padding: 14px;
        background: #111315;
        border-radius: 14px;
    }

    .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
    }

    .title {
        font-size: 14px;
        font-weight: 600;
    }

    .percentage {
        font-size: 14px;
        font-weight: 600;
    }

    .progress {
        width: 100%;
        height: 3px;
        background: #ffffff;
        border-radius: 10px;
        overflow: hidden;
    }

    .progress-fill {
        width: 0%;
        height: 100%;
        background: #2589ff;
        transition: width 0.3s ease;
    }

    .stats {
        margin-top: 9px;
        font-size: 11px;
        color: #8d9299;
    }

    .surahs {
        margin-top: 18px;
    }

    .surah {
        margin-bottom: 8px;
    }

    .surah-header {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        margin-bottom: 5px;
    }

    .surah-name {
        cursor: pointer;
    }

    .verses {
        display: none;
        grid-template-columns: repeat(8, 1fr);
        gap: 4px;
        margin-top: 6px;
    }

    .verses.open {
        display: grid;
    }

    .verse {
        border: 0;
        background: #20242a;
        color: #aaa;
        border-radius: 5px;
        padding: 5px 0;
        font-size: 10px;
        cursor: pointer;
    }

    .verse.active {
        background: #2589ff;
        color: white;
    }
</style>
</head>

<body>

<div class="widget">

    <div class="top">
        <div class="title">CORAN</div>
        <div class="percentage" id="percentage">0%</div>
    </div>

    <div class="progress">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="stats" id="stats">
        0 / 6236 versets
    </div>

    <div class="surahs" id="surahs"></div>

</div>

<script>

    ["Al-Kafirun",6],
    ["An-Nasr",3],
    ["Al-Masad",5],
    ["Al-Ikhlas",4],
    ["Al-Falaq",5],
    ["An-Nas",6]
];

const saved = JSON.parse(localStorage.getItem("quranProgress") || "{}");

const container = document.getElementById("surahs");

surahs.forEach((surah, index) => {

    const [name, count] = surah;

    const div = document.createElement("div");
    div.className = "surah";

    const header = document.createElement("div");
    header.className = "surah-header";

    const nameEl = document.createElement("div");
    nameEl.className = "surah-name";
    nameEl.textContent = `${index + 1}. ${name}`;

    const countEl = document.createElement("div");
    countEl.textContent = `0/${count}`;

    header.appendChild(nameEl);
    header.appendChild(countEl);

    const verses = document.createElement("div");
    verses.className = "verses";

    for (let v = 1; v <= count; v++) {

        const button = document.createElement("button");

        button.className = "verse";
        button.textContent = v;

        if (saved[index]?.includes(v)) {
            button.classList.add("active");
        }

        button.onclick = () => {

            if (!saved[index]) {
                saved[index] = [];
            }

            if (saved[index].includes(v)) {
                saved[index] =
                    saved[index].filter(x => x !== v);
                button.classList.remove("active");
            } else {
                saved[index].push(v);
                button.classList.add("active");
            }

            localStorage.setItem(
                "quranProgress",
                JSON.stringify(saved)
            );

            update();
            countEl.textContent =
                `${saved[index]?.length || 0}/${count}`;
        };

        verses.appendChild(button);
    }

    nameEl.onclick = () => {
        verses.classList.toggle("open");
    };

    div.appendChild(header);
    div.appendChild(verses);

    container.appendChild(div);
});

function update() {

    let known = 0;

    Object.values(saved).forEach(list => {
        known += list.length;
    });

    const percentage =
        Math.floor((known / 6236) * 100);

    document.getElementById("percentage")
        .textContent = percentage + "%";

    document.getElementById("progressFill")
        .style.width = percentage + "%";

    document.getElementById("stats")
        .textContent = `${known} / 6236 versets`;
}

update();

</script>

</body>
</html>
